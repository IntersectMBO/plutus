# This workflow removes PR previews from gh-pages.
#
# The docusaurus, cost-models and papers workflows deploy a preview of each
# same-repository PR to pr-preview/<site>/pr-<number>. When a PR is closed,
# this workflow removes its previews and says so in the PR's preview comments.
# When triggered manually, it removes the previews of every PR that is no
# longer open.

name: "🧹 PR Preview Cleanup"

on:
  pull_request:
    types: [closed]
    # Only PRs that can have a preview: the union of the path filters of the
    # docusaurus, cost-models and papers workflows.
    paths:
      - 'doc/**'
      - '.github/workflows/docusaurus-site.yml'
      - '.github/workflows/cost-models-site.yml'
      - '.github/workflows/papers-and-specs.yml'
  workflow_dispatch:

# One group per PR, so closing several PRs at once doesn't cancel queued runs;
# concurrent pushes to gh-pages are already serialised by the deploy script.
concurrency:
  group: pr-preview-cleanup-${{ github.event.pull_request.number || 'all' }}

env:
  # The folders under pr-preview/ that the site workflows deploy previews to.
  PREVIEW_SITES: docs cost-models resources

jobs:
  cleanup:
    name: Cleanup
    # PRs from forks never get previews, and runs triggered by Dependabot get a
    # read-only token.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Use the script from the default branch rather than from the PR.
      - name: Checkout Deploy Script
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: scripts/deploy-gh-pages.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Remove Closed PR Previews
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          FOLDERS=()
          for site in $PREVIEW_SITES; do
            FOLDERS+=("pr-preview/$site/pr-$PR_NUMBER")
          done
          ./scripts/deploy-gh-pages.sh --remove "${FOLDERS[@]}"

      # Keep each comment's marker, so a reopened PR's new preview link
      # replaces this note.
      - name: Update Preview Comments
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7.1.0
        with:
          script: |
            const markers = ['<!-- docusaurus-preview -->', '<!-- cost-models-preview -->'];
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            for (const comment of comments) {
              const marker = markers.find(marker => comment.body.includes(marker));
              if (marker) {
                const body = `${marker}\nPreview removed because the pull request was closed.`;
                await github.rest.issues.updateComment({ owner, repo, comment_id: comment.id, body });
              }
            }

      - name: Remove All Stale Previews
        if: github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Lists the subfolders of a gh-pages folder; a missing folder is
          # empty, any other API error fails the step.
          list_dirs() {
            local out
            if out=$(gh api "repos/$GITHUB_REPOSITORY/contents/$1?ref=gh-pages" \
                       --jq '.[] | select(.type == "dir") | .name' 2>&1); then
              printf '%s\n' "$out"
            elif ! grep -q 'HTTP 404' <<<"$out"; then
              printf '%s\n' "$out" >&2
              return 1
            fi
          }

          OPEN=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number --jq '.[].number')
          STALE=()
          for site in $PREVIEW_SITES; do
            NAMES=$(list_dirs "pr-preview/$site")
            while read -r name; do
              if [[ "$name" =~ ^pr-[0-9]+$ ]] && ! grep -qxF "${name#pr-}" <<<"$OPEN"; then
                STALE+=("pr-preview/$site/$name")
              fi
            done <<<"$NAMES"
          done
          if ((${#STALE[@]} == 0)); then
            echo "No stale previews"
            exit 0
          fi
          printf 'Removing %s\n' "${STALE[@]}"
          ./scripts/deploy-gh-pages.sh --remove "${STALE[@]}"
