# This workflow builds and deploys various papers.
# 
# On pull requests, this workflow builds the papers and deploys a temporary preview
# to gh-pages, but only if the relevant files have changed.
#
# This workflow runs on all push to master and can also be triggered manually.
# It deploys the artifacts to: https://plutus.cardano.intersectmbo.org/resources

name: "📝 Papers & Specs"

on:
  workflow_dispatch:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'doc'
      - '!doc/docusaurus/**'

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, plutus-runner]
    permissions:
      contents: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build Papers
        run: | 
          TARGETS=(
            plutus-report
            plutus-core-spec
            extended-utxo-spec
            unraveling-recursion-paper
            system-f-in-agda-paper
            eutxo-paper
            utxoma-paper
            eutxoma-paper
          )
          mkdir -p _resources
          for target in "${TARGETS[@]}"; do 
            nix build --no-warn-dirty --accept-flake-config .#${target}
            cp -fr ./result/*.pdf _resources/${target}.pdf
          done 

      - name: Publish Papers
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-gh-pages.sh _resources resources

      - name: Publish Preview Papers
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          ./scripts/deploy-gh-pages.sh _resources "pr-preview/resources/pr-$PR_NUMBER"
          echo "Preview: https://plutus.cardano.intersectmbo.org/pr-preview/resources/pr-$PR_NUMBER/" >> "$GITHUB_STEP_SUMMARY"
