# This workflow builds and deploys the Docusaurus site.
# 
# On pull requests, this workflow builds the site and deploys a temporary preview
# to gh-pages, but only if the relevant files have changed.
#
# On push to master or on workflow dispatch it deploys the site to: 
# https://plutus.cardano.intersectmbo.org/docs


name: "🦕 Docusaurus Site" 

on:
  push: 
    branches: 
      - master 
  workflow_dispatch:
  pull_request:
    paths:
      - 'doc/docusaurus/**'
      - '.github/workflows/docusaurus-site.yml'

jobs:
  run:
    name: Run 
    runs-on: [self-hosted, plutus-runner]
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Build Site 
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: doc/docusaurus
        run: nix develop --no-warn-dirty --accept-flake-config --command bash -c 'yarn && yarn build'

      - name: Build Preview Site
        if: github.event_name == 'pull_request' && github.event.action != 'closed'
        working-directory: doc/docusaurus
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # These match the URL the Deploy Preview Site step deploys to:
          export DOCUSAURUS_URL="https://plutus.cardano.intersectmbo.org"
          export DOCUSAURUS_BASE_URL="/pr-preview/docs/pr-${PR_NUMBER}"
          nix develop --no-warn-dirty --accept-flake-config --command bash -c 'yarn && yarn build'

      # The build runs third-party yarn packages, which could modify the working
      # tree, so check out a fresh copy of the deploy script after the build.
      - name: Checkout Deploy Script
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-script
          sparse-checkout: scripts/deploy-gh-pages.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Deploy Site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .deploy-script/scripts/deploy-gh-pages.sh doc/docusaurus/build docs

      - name: Deploy Preview Site
        # PRs from forks, and runs triggered by Dependabot, get a read-only token.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .deploy-script/scripts/deploy-gh-pages.sh doc/docusaurus/build "pr-preview/docs/pr-$PR_NUMBER"

      - name: Comment Preview Link
        # PRs from forks, and runs triggered by Dependabot, get a read-only token.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]'
        uses: actions/github-script@v7.1.0
        env:
          PREVIEW_URL: https://plutus.cardano.intersectmbo.org/pr-preview/docs/pr-${{ github.event.pull_request.number }}/
        with:
          script: |
            const marker = '<!-- docusaurus-preview -->';
            const body = `${marker}\n🦕 Docusaurus preview for this PR: ${process.env.PREVIEW_URL}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
