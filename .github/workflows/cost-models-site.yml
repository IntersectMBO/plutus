# This workflow deploys the cost-models visualization site.
#
# On pull requests, this workflow deploys a temporary preview
# to gh-pages, but only if the relevant files have changed.
#
# On push to master or on workflow dispatch it deploys the site to:
# https://plutus.cardano.intersectmbo.org/cost-models


name: "📊 Cost Models Site"

on:
  push:
    branches:
      - master
    paths:
      - 'doc/cost-models/**'
      - '.github/workflows/cost-models-site.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'doc/cost-models/**'
      - '.github/workflows/cost-models-site.yml'

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, plutus-runner]
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Deploy Site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./scripts/deploy-gh-pages.sh doc/cost-models cost-models

      - name: Deploy Preview Site
        # PRs from forks get a read-only token, so they can't deploy previews.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: ./scripts/deploy-gh-pages.sh doc/cost-models "pr-preview/cost-models/pr-$PR_NUMBER"

      # The pages read the benchmark CSV and the cost model JSON from a branch of this
      # repository, and remember the last branch used in the browser's local storage.
      # The `branch` parameter in the link overrides that, so the preview of this PR
      # plots this PR's data for everyone who opens it.
      - name: Comment Preview Link
        # PRs from forks get a read-only token, so they can't deploy previews.
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@v7.1.0
        env:
          PREVIEW_URL: https://plutus.cardano.intersectmbo.org/pr-preview/cost-models/pr-${{ github.event.pull_request.number }}/
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const url = `${process.env.PREVIEW_URL}?branch=${encodeURIComponent(branch)}`;
            const marker = '<!-- cost-models-preview -->';
            const body = `${marker}\n📊 Cost model pages for this PR: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
