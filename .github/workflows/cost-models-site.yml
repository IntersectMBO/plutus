# This workflow deploys the cost-models visualization site.
#
# On pull requests, this workflow deploys a temporary preview
# to gh-pages, but only if the relevant files have changed.
#
# On push to master or on workflow dispatch it deploys the site to:
# https://plutus.cardano.intersectmbo.org/cost-models


name: "📊 Cost Models Site"

on:
  push:
    branches:
      - master
    paths:
      - 'doc/cost-models/**'
      - '.github/workflows/cost-models-site.yml'
  workflow_dispatch:
  pull_request:
    paths:
      - 'doc/cost-models/**'
      - '.github/workflows/cost-models-site.yml'

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, plutus-runner]
    permissions:
      contents: write
      pull-requests: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Deploy Site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: JamesIves/github-pages-deploy-action@v4.9.0
        with:
          folder: doc/cost-models
          target-folder: cost-models
          single-commit: true

      - name: Deploy Preview Site
        id: preview
        if: github.event_name == 'pull_request'
        uses: rossjrw/pr-preview-action@v1.6.3
        with:
          source-dir: doc/cost-models
          umbrella-dir: pr-preview/cost-models
          # The link is posted by the next step instead, with the branch in it.
          comment: false

      # The pages read the benchmark CSV and the cost model JSON from a branch of this
      # repository, and remember the last branch used in the browser's local storage.
      # The `branch` parameter in the link overrides that, so the preview of this PR
      # plots this PR's data for everyone who opens it.
      - name: Comment Preview Link
        if: github.event_name == 'pull_request' && steps.preview.outputs['deployment-action'] == 'deploy'
        uses: actions/github-script@v7.1.0
        env:
          PREVIEW_URL: ${{ steps.preview.outputs['preview-url'] }}
        with:
          script: |
            const branch = context.payload.pull_request.head.ref;
            const url = `${process.env.PREVIEW_URL}?branch=${encodeURIComponent(branch)}`;
            const marker = '<!-- cost-models-preview -->';
            const body = `${marker}\n📊 Cost model pages for this PR: ${url}`;
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number
            });
            const existing = comments.find(comment => comment.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
