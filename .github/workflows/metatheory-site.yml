# This workflow builds and deploys the Metatheory site.
# 
# When this workflow is triggered manually via workflow dispatch, it builds and then 
# publishes the site according to the 'ref' input:
# https://plutus.cardano.intersectmbo.org/metatheory/$version
# And optionally (if the 'latest' flag is set) to: 
# https://plutus.cardano.intersectmbo.org/metatheory/latest
#
# This workflow also builds and publishes the site on push to master to:
# https://plutus.cardano.intersectmbo.org/metatheory/master


name: "🔮 Metatheory Site"

on:
  push: 
    branches: 
      - master 

  workflow_dispatch:
    inputs:
      ref:
        description: |
          The $ref to build off of, e.g. "1.29.0.0", "master", or any other valid git ref.
          When making a release, this is usually the version tag, e.g. "1.29.0.0", and will be
          equal to the $destination input below. When back-porting this could be a commit sha instead.
        required: true
        type: string

      destination:
        description: |
          The $destination folder, e.g. when "1.29.0.0" the metatheory site will be deployed to:
          https://plutus.cardano.intersectmbo.org/metatheory/1.29.0.0
        required: true
        type: string
  
      latest: 
        description: |
          If true, then the metatheory site will also be deployed to:
          https://plutus.cardano.intersectmbo.org/metatheory/latest.
          You want to leave this to true unless you are deploying old versions or back-porting.
        type: boolean
        required: true 
        default: true

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, plutus-runner]
    permissions:
      contents: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Build Site
        run: | 
          nix build --accept-flake-config .#metatheory-site
          mkdir _metatheory
          cp -RL result/* _metatheory

      # The checked-out ref may predate the deploy script, so take it from the
      # commit this workflow runs from. This is fetched into a fresh repository
      # right before deploying, after the build steps (which run code from
      # inputs.ref) have finished, so they cannot tamper with it.
      - name: Fetch Deploy Script
        run: |
          SCRIPT_REPO=$(mktemp -d "$RUNNER_TEMP/deploy-script.XXXXXX")
          git init --quiet --bare "$SCRIPT_REPO"
          git -C "$SCRIPT_REPO" fetch --quiet --depth=1 "https://github.com/$GITHUB_REPOSITORY" "$GITHUB_SHA"
          git -C "$SCRIPT_REPO" --no-replace-objects show "$GITHUB_SHA:scripts/deploy-gh-pages.sh" > "$SCRIPT_REPO/deploy-gh-pages.sh"
          chmod +x "$SCRIPT_REPO/deploy-gh-pages.sh"
          echo "DEPLOY_SCRIPT=$SCRIPT_REPO/deploy-gh-pages.sh" >> "$GITHUB_ENV"

      - name: Deploy Site
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESTINATION: ${{ inputs.destination || github.ref_name }}
          PRUNE_DIR: metatheory
          PRUNE_KEEP: 8
        run: '"$DEPLOY_SCRIPT" _metatheory "metatheory/$DESTINATION"'

      - name: Deploy Site (latest)
        if: ${{ inputs.latest == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: '"$DEPLOY_SCRIPT" _metatheory metatheory/latest'
