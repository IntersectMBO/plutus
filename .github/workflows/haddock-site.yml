# This workflow builds and deploys the Haddock site.
# 
# When this workflow is triggered manually via workflow dispatch, it builds and then 
# publishes the site according to the 'ref' input:
# https://plutus.cardano.intersectmbo.org/haddock/$ref
# And optionally (if the 'latest' flag is set) to: 
# https://plutus.cardano.intersectmbo.org/haddock/latest
#
# This workflow also builds and publishes the site on push to master to:
# https://plutus.cardano.intersectmbo.org/haddock/master
#
# This workflow does not trigger on each pull request because it takes about 1h to run.
# However it will build (but not deploy) the site on pull requests to the release/* branches.


name: "📜 Haddock Site"

concurrency:
  group: haddock-site
  cancel-in-progress: true

on:
  push: 
    branches:
      - master
  pull_request:
    branches:
      - 'release/*'
      
  workflow_dispatch:
    inputs:
      ref:
        description: |
          The ref to build off of, e.g. "1.29.0.0", "master", or any other valid git ref.
          When making a release, this is usually the version tag, e.g. "1.29.0.0", and will be
          equal to the $destination input below. When back-porting this could be a commit sha instead.
        required: true
        type: string

      destination:
        description: |
          The destination folder, e.g. when "1.29.0.0" the haddock site will be deployed to:
          https://plutus.cardano.intersectmbo.org/haddock/1.29.0.0
        required: true
        type: string
  
      latest: 
        description: |
          If true, then the haddock site will also be deployed to:
          https://plutus.cardano.intersectmbo.org/haddock/latest.
          You want to check this when you are making a release.
          You want to uncheck this when you are deploying old versions or back-porting.
        type: boolean
        required: true 
        default: true

      script_ref: 
          description: |
            What branch to fetch the combined-haddock.sh script from.
            Leave this to 'master' unless you are testing a new version of the script.
          type: string
          required: true 
          default: 'master'

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, plutus-runner]
    timeout-minutes: 120
    permissions:
      contents: write
    environment:
      name: github-pages
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref_name }}

      - name: Checkout Haddock Script
        env:
          SCRIPT_REF: ${{ inputs.script_ref || github.ref_name }}
        run: |
          if ! printf '%s' "$SCRIPT_REF" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9._/-]*$'; then
            echo "::error::Invalid script_ref '$SCRIPT_REF' (must match ^[A-Za-z0-9_][A-Za-z0-9._/-]*\$)"
            exit 1
          fi
          git fetch origin --end-of-options "$SCRIPT_REF"
          git checkout "origin/$SCRIPT_REF" -- ./scripts/combined-haddock.sh
            
      - name: Build Site
        run: | 
          nix develop --no-warn-dirty --accept-flake-config --command ./scripts/combined-haddock.sh _haddock all

      # The checked-out ref may predate the deploy script, so check it out from
      # the commit this workflow runs from. This happens right before deploying,
      # after the build steps (which run code from inputs.ref), so they cannot
      # tamper with it.
      - name: Checkout Deploy Script
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.sha }}
          path: .deploy-script
          sparse-checkout: scripts/deploy-gh-pages.sh
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Deploy Site
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DESTINATION: ${{ inputs.destination || github.ref_name }}
          # Keep the 6 newest version-numbered builds in haddock/ (master and
          # latest are never pruned); any older ones are removed by this deploy.
          PRUNE_DIR: haddock
          PRUNE_KEEP: 6
        run: .deploy-script/scripts/deploy-gh-pages.sh _haddock "haddock/$DESTINATION"

      - name: Deploy Site (latest)
        if: ${{ inputs.latest == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .deploy-script/scripts/deploy-gh-pages.sh _haddock haddock/latest
